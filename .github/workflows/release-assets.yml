name: Build & upload release assets

# Auto-builds tdpilot.plugin (Claude Code plugin ZIP) and tdpilot.mcpb
# (Claude Desktop one-click bundle) on every release, then attaches them
# to the GitHub Release. Without this, Anthropic's plugin Directory and
# Claude Desktop's one-click installer index from whichever release last
# happened to have the .mcpb attached — which is how v1.5.6 went out
# without these assets and the Directory ended up pinned at v1.5.0
# metadata for months.
#
# Trigger pattern:
#   - release.published — fires when you create the release (manually or
#     via `gh release create`). Builds + uploads in one shot.
#   - workflow_dispatch — manually re-run for an existing tag (useful for
#     backfilling old releases).
#
# .tox is NOT auto-built here — it has to be rebuilt inside a running
# TouchDesigner instance (see CLAUDE.md: _TOX_SOURCE_FILES). Instead the
# COMMITTED td_component/tdpilot.tox from the tag checkout is uploaded as
# the canonical `tdpilot.tox` release asset (self_updater.DEFAULT_ASSET_NAME
# downloads exactly that name; releases v1.6.9–v2.0.3 shipped without it,
# which silently broke td_self_update's install path). Freshness of the
# committed binary is enforced separately by scripts/check_tox_freshness.py
# in CI.
#
# Security note: untrusted release/dispatch inputs are captured via env:
# blocks and referenced as shell variables (per
# github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/).

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build assets for (e.g. v1.6.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  # Needed by the "Require green CI" step to read workflow-run conclusions.
  actions: read

jobs:
  build-and-upload:
    name: Build .plugin + .mcpb and attach to release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve a tag from event payload or input"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      # Publish gating (audit batch E): this workflow fires on release
      # publish with NO dependency on CI — a release created off a red (or
      # never-tested) commit would happily ship assets. Resolve the tagged
      # commit's CI conclusion via the GitHub API and fail before building
      # when CI is not green for that exact SHA. Untrusted inputs stay in
      # env vars (repo security style); the SHA comes from the checked-out
      # tag itself, not from event payload text.
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Tagged commit: $sha"
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            runs_json="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs')"
            total="$(printf '%s' "$runs_json" | jq 'length')"
            green="$(printf '%s' "$runs_json" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
            pending="$(printf '%s' "$runs_json" | jq '[.[] | select(.status != "completed")] | length')"
            if [ "$green" -ge 1 ]; then
              echo "CI is green for $sha ($green successful run(s))."
              break
            fi
            if [ "$pending" -ge 1 ] || [ "$total" -eq 0 ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for a green CI run for $sha (runs: $total, pending: $pending). Refusing to build release assets."
                exit 1
              fi
              echo "CI not concluded yet for $sha (runs: $total, pending: $pending) — retrying in 30s..."
              sleep 30
              continue
            fi
            echo "::error::CI concluded non-success for $sha. Fix CI on the tagged commit, then re-run this workflow."
            exit 1
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic mcpb CLI
        # build_mcpb.py shells out to the `mcpb` CLI for the final pack step.
        # Install it globally so it lands on PATH for the next step.
        run: npm install -g @anthropic-ai/mcpb

      - name: Install dependencies
        run: uv sync --all-extras

      # Release gates (audit batch E). check_release_gates.py's strongest
      # mode is --require-complete, but that additionally demands the
      # brain_live_smoke and operator_availability reports, which can only
      # be produced against a live TouchDesigner (CI runners have none) and
      # whose committed point-in-time copies under reports/ can lag the
      # gate's schema. Rubber-stamping stale live artifacts — or hard-
      # blocking tags on files CI cannot regenerate — would both be wrong,
      # so CI runs the strongest HONEST subset instead: every offline-
      # generatable report is regenerated fresh here and required
      # (--require-plugin-surface --require-param-semantics-risk), while
      # bench/soak come from the committed release-ritual reports. The full
      # --require-complete gate remains a release-time step on a dev
      # machine with TouchDesigner running (output: reports/release_gates.json).
      - name: Release gates (offline-verifiable subset, reports regenerated fresh)
        run: |
          mkdir -p /tmp/gate-reports
          uv run python scripts/eval_brain_golden.py > /tmp/gate-reports/brain_eval.json
          uv run python scripts/brain_live_smoke.py --dry-run > /tmp/gate-reports/brain_smoke_dry_run.json
          uv run python scripts/audit_plugin_surface.py > /tmp/gate-reports/plugin_surface.json
          uv run python scripts/audit_param_semantics_risks.py > /tmp/gate-reports/param_semantics_risk.json
          uv run python scripts/check_release_gates.py \
            --bench-report reports/bench_tools.json \
            --soak-report reports/soak_events.json \
            --brain-eval-report /tmp/gate-reports/brain_eval.json \
            --brain-smoke-report /tmp/gate-reports/brain_smoke_dry_run.json \
            --plugin-surface-report /tmp/gate-reports/plugin_surface.json \
            --param-semantics-risk-report /tmp/gate-reports/param_semantics_risk.json \
            --require-plugin-surface --require-param-semantics-risk

      - name: Build tdpilot.plugin
        run: uv run python scripts/build_plugin_zip.py

      - name: Build tdpilot.mcpb
        run: uv run python scripts/build_mcpb.py

      - name: Verify built artifacts exist
        run: |
          test -f tdpilot.plugin || { echo "::error::tdpilot.plugin not produced"; exit 1; }
          test -f tdpilot.mcpb   || { echo "::error::tdpilot.mcpb not produced"; exit 1; }
          test -f td_component/tdpilot.tox || { echo "::error::td_component/tdpilot.tox missing from tag checkout — td_self_update depends on this asset"; exit 1; }
          ls -lh tdpilot.plugin tdpilot.mcpb td_component/tdpilot.tox

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          gh release upload "$TAG" tdpilot.plugin tdpilot.mcpb td_component/tdpilot.tox --clobber
          echo "Uploaded tdpilot.plugin + tdpilot.mcpb + tdpilot.tox to release $TAG"
